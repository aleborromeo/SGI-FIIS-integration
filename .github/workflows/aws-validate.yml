name: Validate AWS deployment

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  user-credentials:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/fiis/pom.xml
      - name: Verify temporary password survives persistence mapping
        run: mvn -B -f backend/fiis/pom.xml -Dtest=CreateUserUseCaseTest test
  windows-provision:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify Windows PowerShell 5.1 provisioning without AWS
        shell: powershell
        run: ./tests/test_aws_provision.ps1
      - name: Verify PowerShell 7 provisioning without AWS
        shell: pwsh
        run: ./tests/test_aws_provision.ps1
  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install CloudFormation linter
        run: python3 -m pip install cfn-lint==1.58.0
      - name: Validate infrastructure without creating AWS resources
        run: |
          cfn-lint deploy/aws/ec2.yaml
          bash -n deploy/aws/provision.sh
          python3 -m unittest discover -s tests -p 'test_aws_provision.py'
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Create isolated test configuration
        run: python3 deploy/aws/config.py init --mode fresh
      - name: Validate shell and Compose configuration
        run: |
          for script in deploy/aws/*.sh; do bash -n "$script"; done
          python3 deploy/aws/config.py validate
          docker compose --env-file .env.aws -f docker-compose.aws.yml config --quiet
      - name: Build API including Java test compilation
        run: docker compose --env-file .env.aws -f docker-compose.aws.yml build api
      - name: Build frontend with production TypeScript checks
        run: docker compose --env-file .env.aws -f docker-compose.aws.yml build web
      - name: Start stack and check routes
        run: |
          bash deploy/aws/start.sh
          python3 - <<'PY'
          import json
          from urllib.request import Request, urlopen
          with urlopen('http://localhost/health', timeout=20) as response:
              assert json.load(response)['database'] == 'CONNECTED'
          with urlopen('http://localhost/login', timeout=20) as response:
              assert '<html' in response.read().decode().lower()
          with urlopen('http://localhost/api/v1/auth/public-stats', timeout=20) as response:
              assert isinstance(json.load(response), dict)
          request = Request('http://localhost/api/v1/auth/login',
                            data=json.dumps({'email': 'admin@unas.edu.pe', 'password': '00000000'}).encode(),
                            headers={'Content-Type': 'application/json', 'X-Requested-With': 'XMLHttpRequest'})
          with urlopen(request, timeout=20) as response:
              assert json.load(response).get('token'), 'No se recibio un JWT al iniciar sesion'
          print('API, PostgreSQL, SPA y login comprobados en el entorno de CI.')
          PY
      - name: Verify demo account setup
        run: |
          temporary_password="$(openssl rand -hex 12)"
          printf 'admin@unas.edu.pe\n%s\n%s\n' "$temporary_password" "$temporary_password" | bash deploy/aws/secure-demo.sh --fresh-install
          TEST_PASSWORD="$temporary_password" python3 - <<'PY'
          import json, os
          from urllib.request import Request, urlopen
          request = Request('http://localhost/api/v1/auth/login',
                            data=json.dumps({'email': 'admin@unas.edu.pe', 'password': os.environ['TEST_PASSWORD']}).encode(),
                            headers={'Content-Type': 'application/json'})
          with urlopen(request, timeout=20) as response:
              admin = json.load(response)
              assert admin.get('token')
          print('Login con la nueva clave temporal comprobado.')
          headers = {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + admin['token']}
          create = Request('http://localhost/api/v1/users',
                           data=json.dumps({'dni': '99112233', 'firstNames': 'QA', 'lastNames': 'Credentials',
                                            'institutionalEmail': 'qa.credentials@unas.edu.pe',
                                            'roleCode': 'EVALUADOR'}).encode(), headers=headers)
          with urlopen(create, timeout=20) as response:
              assert response.status == 201
              created = json.load(response)
          temporary = created.get('temporaryPassword')
          assert temporary and temporary != '99112233', 'Falta la clave temporal del nuevo usuario'
          login = Request('http://localhost/api/v1/auth/login',
                          data=json.dumps({'email': created['institutionalEmail'], 'password': temporary}).encode(),
                          headers={'Content-Type': 'application/json'})
          with urlopen(login, timeout=20) as response:
              session = json.load(response)
              assert session.get('token') and session.get('mustChangePassword') is True
          get_user = Request('http://localhost/api/v1/users/' + str(created['id']), headers=headers)
          with urlopen(get_user, timeout=20) as response:
              assert not json.load(response).get('temporaryPassword'), 'La clave temporal no debe persistirse'
          print('Alta, entrega de clave temporal y login del evaluador comprobados con PostgreSQL real.')
          PY
      - name: Verify backup and restore into separate volumes
        run: |
          docker compose --env-file .env.aws -f docker-compose.aws.yml exec -T api sh -c 'printf "backup-probe\n" > /app/uploads-fiis/backup-probe.txt'
          bash deploy/aws/backup.sh
          backup_dir="$(python3 -c 'from pathlib import Path; print(sorted(Path("backups").iterdir())[-1])')"
          docker compose --env-file .env.aws -f docker-compose.aws.yml down
          sed -i 's/^DATA_MODE=fresh$/DATA_MODE=restore/' .env.aws
          COMPOSE_PROJECT_NAME=sgi-fiis-restore-ci bash deploy/aws/restore.sh "$backup_dir"
          COMPOSE_PROJECT_NAME=sgi-fiis-restore-ci bash deploy/aws/start.sh
          docker compose --project-name sgi-fiis-restore-ci --env-file .env.aws -f docker-compose.aws.yml exec -T api grep -qx backup-probe /app/uploads-fiis/backup-probe.txt
      - name: Logs on failure
        if: failure()
        run: |
          docker compose --env-file .env.aws -f docker-compose.aws.yml logs --tail=120
          docker compose --project-name sgi-fiis-restore-ci --env-file .env.aws -f docker-compose.aws.yml logs --tail=120
      - name: Stop isolated test stack
        if: always()
        run: |
          docker compose --env-file .env.aws -f docker-compose.aws.yml down --volumes
          docker compose --project-name sgi-fiis-restore-ci --env-file .env.aws -f docker-compose.aws.yml down --volumes
